services:
  db:
    image: postgres:18.3-alpine
    container_name: clothing_shop_db
    volumes:
      - postgres_data:/var/lib/postgresql/
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: development
    container_name: clothing_shop_backend
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /app/backend/scripts/entrypoint.sh
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: clothing_shop_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
    depends_on:
      - backend
  redis:
    image: redis:7-alpine
    container_name: clothing_shop_redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:stable-alpine
    container_name: clothing_shop_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
  media_volume:
