upstream backend {
    server backend:8000;
}

server {
    listen 80;

    location ~ ^/(api|admin) {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    }
}
